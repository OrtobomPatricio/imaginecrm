name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 10.4.1
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run TypeScript check
        run: pnpm check
      
      - name: Validate production config contract
        run: pnpm validate:prod-config
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.CI_DATA_ENCRYPTION_KEY }}
          COOKIE_SECRET: ${{ secrets.CI_COOKIE_SECRET }}
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          ALLOW_DEV_LOGIN: "0"
          ENABLE_DEV_BYPASS: "0"
          VITE_DEV_BYPASS_AUTH: "0"
          REQUIRE_REDIS_IN_PROD: "0"

      - name: Build
        run: pnpm build


  real-db-parity:
    name: Real DB Parity
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chin_crm
          MYSQL_USER: crm
          MYSQL_PASSWORD: change_me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 10.4.1
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot && exit 0
            sleep 2
          done
          echo "MySQL did not become ready in time" && exit 1

      - name: Apply schema to real MySQL
        run: pnpm db:push
        env:
          DATABASE_URL: mysql://crm:change_me@127.0.0.1:3306/chin_crm

      - name: Run real DB parity test
        run: pnpm test:real-db
        env:
          RUN_REAL_DB_PARITY: "1"
          DATABASE_URL: mysql://crm:change_me@127.0.0.1:3306/chin_crm

  deploy:
    needs: [test, real-db-parity]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/crm-pro  # Ajusta la ruta si es diferente
            git pull
            # Asegurar que los scripts tengan permisos de ejecución
            chmod +x deploy/*.sh
            
            # Rebuild y restart
            docker compose down
            docker compose up -d --build
            
            # Limpieza de imágenes viejas
            docker image prune -f
